[package]
name = "vibrato-rkyv"
version = "0.7.13"
edition = "2024"
authors = [
    "o24s <fulmlumo@gmail.com>",
    "Shunsuke Kanda <shnsk.knd@gmail.com>",
    "Koichi Akabe <vbkaisetsu@gmail.com>",
]
description = "Vibrato: viterbi-based accelerated tokenizer with rkyv support for fast dictionary loading."
license = "MIT OR Apache-2.0"
homepage = "https://github.com/o24s/vibrato-rkyv"
repository = "https://github.com/o24s/vibrato-rkyv"
readme = "../README.md"
keywords = ["japanese", "analyzer", "tokenizer", "morphological"]
categories = ["text-processing"]

[dependencies]
bumpalo = "3.20.3"
csv-core = "0.1.13"
digest-io = "0.1.0"
dirs = "7.0.0"
fs4 = { version = "1.1.0", features = ["sync"] }
hashbrown = "0.17.1"
hex = "0.4.3"
log = "0.4.30"
memmap2 = "0.9.11"
regex = "1.12.3"
reqwest = { version = "0.13.4", features = ["blocking"], optional = true }
sha2 = "0.11.0"
tar = { version = "0.4.46", optional = true }
tempfile = "3.27.0"
thiserror = "2.0.18"
walkdir = { version = "2.5.0", optional = true }
xz2 = { version = "0.1.7", optional = true }
zstd = "0.14.0"

rkyv = { version = "0.8.16", features = ["hashbrown-0_17"] }
crawdad-rkyv = "0.4.0-rkyv.3"
rucrf-rkyv = { version = "0.3.3-rkyv.3", optional = true }

bincode = { version = "2.0.1", default-features = false, features = ["std", "alloc", "derive"], optional = true }
crawdad = { version = "0.4.0", optional = true }
rucrf = { version = "0.3.3", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
vibrato = "0.5.2"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs.git", rev = "54e85e8f7e0a6c4b570cd7b103506b080dc60c92" }
xz2 = "0.1.7"
zip = "8.6.0"

[features]
default = ["train", "download"]

train = ["rucrf-rkyv"]
download = ["dep:reqwest", "dep:tar", "dep:xz2", "dep:walkdir"]
legacy = ["dep:bincode", "dep:crawdad", "dep:rucrf"]

[[test]]
name = "loading_tests"
path = "src/tests/loading_tests.rs"
required-features = ["download", "legacy"]

[[bench]]
name = "vibrato_init"
harness = false

[[bench]]
name = "vibrato_init_zstd"
harness = false

[[bench]]
name = "vibrato_rkyv_init"
harness = false

[[bench]]
name = "tokenization"
harness = false
required-features = ["legacy"]

[[bench]]
name = "tokenization_sudachi"
harness = false
